<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="云南竹江纸业有限公司官网正在开发中" />
  <title>云南竹江纸业有限公司</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", sans-serif;
      color: #1d2087;
      background:
        radial-gradient(circle at top right, rgba(145, 207, 255, 0.45), transparent 42%),
        linear-gradient(180deg, #f7fbff 0%, #eef6ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 20px;
      padding: 48px 32px 28px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(29, 32, 135, 0.08);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #91cfff 0%, #6bb8f0 100%);
      color: #1d2087;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 22px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .status {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #e8f6ff;
      color: #1d2087;
      font-size: 15px;
      margin-bottom: 28px;
    }
    p {
      color: #5a5d8a;
      font-size: 15px;
      line-height: 1.8;
    }
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #eef2f8;
      font-size: 13px;
      color: #7b7ea8;
    }
    footer a {
      color: #1d2087;
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>云南竹江纸业有限公司</h1>
    <div class="status">网站正在开发中</div>
    <p>官网建设中，敬请期待。</p>
    <footer>
      <a href="https://beian.miit.gov.cn/" target="_blank">	滇ICP备2025062410号</a>
    </footer>
  </main>
</body>
</html>
