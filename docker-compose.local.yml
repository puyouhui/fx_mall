services:
  minio:
    image: minio/minio:latest
    container_name: zhujiang-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zhujiang_local
      MINIO_ROOT_PASSWORD: zhujiang_minio_local_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zhujiang_minio_data:/data

volumes:
  zhujiang_minio_data:
